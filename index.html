<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Presensi Yuk | Guru — Absen guru dengan GPS & selfie" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/pg-favicon-32-v1.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/pg-apple-180-v1.png" />
    <meta name="apple-mobile-web-app-title" content="Presensi Yuk | Guru" />
    <meta name="application-name" content="Presensi Yuk | Guru" />
    <title>Presensi Yuk | Guru</title>
    <style>
      #loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#3b82f6,#2563eb,#1d4ed8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
      #loadingScreen::before,#loadingScreen::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(28px);pointer-events:none}
      #loadingScreen::before{width:220px;height:220px;top:-60px;right:-50px}
      #loadingScreen::after{width:160px;height:160px;bottom:-40px;left:-40px}
      #loadingScreen img{width:104px;height:104px;border-radius:24px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:lsPulse 1.5s ease-in-out infinite;position:relative;z-index:1}
      #loadingScreen .ls-title{font-size:1.5rem;font-weight:800;letter-spacing:.3px;position:relative;z-index:1;white-space:nowrap}
      #loadingScreen .ls-title i{font-style:italic}
      @keyframes lsPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
    </style>
  </head>
  <body>
    <div id="loadingScreen">
      <img src="/icons/pg-192-v1.png" alt="Presensi Yuk | Guru" />
      <div class="ls-title"><i>Presensi Yuk</i> | Guru</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
